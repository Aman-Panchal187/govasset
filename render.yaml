databases:
  - name: govasset-db
    plan: free
    databaseName: govasset
services:
  - type: web
    name: govasset-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npx tsx prisma/seed-if-empty.ts && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: govasset-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false   # set to your Vercel URL after the frontend deploys
      - key: NODE_VERSION
        value: 20.18.0
